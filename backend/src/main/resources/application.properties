spring.application.name=quran-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework

app.audio.base-url=https://cdn.islamic.network/quran/audio/128
app.audio.reciter=ar.alafasy
app.corpus.uthmani-url=https://api.alquran.cloud/v1/quran/quran-uthmani
app.corpus.translation-url=https://api.alquran.cloud/v1/quran/en.sahih
app.corpus.cache-file=data/quran-cache.json
app.corpus.skip-remote=false
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:4200,https://www.nooralquran.com,https://nooralquran.com}
