name: Desktop Windows 32-bit

on:
  workflow_dispatch:
  push:
    paths:
      - 'frontend/electron/**'
      - 'frontend/electron-builder.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/scripts/write-win-icon.mjs'
      - '.github/workflows/desktop-win32.yml'
  pull_request:
    paths:
      - 'frontend/electron/**'
      - 'frontend/electron-builder.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/scripts/write-win-icon.mjs'
      - '.github/workflows/desktop-win32.yml'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build 32-bit Windows app
        run: npm run dist:win32
      - uses: actions/upload-artifact@v4
        with:
          name: noor-windows-ia32
          path: frontend/dist-desktop/*.exe
