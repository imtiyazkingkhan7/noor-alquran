services:
  - type: web
    name: noor-alquran
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8080"
      - key: APP_CORS_ORIGINS
        value: https://www.nooralquran.com,https://nooralquran.com,http://localhost:4200
